name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      # npm Trusted Publishing (OIDC): no NODE_AUTH_TOKEN / repository secret needed.
      # Requires this repo + workflow to be registered as a trusted publisher on
      # npmjs.com -> package "dsh-hoi4-modding" -> Settings -> Trusted Publisher.
      - run: npm publish --provenance --access public
